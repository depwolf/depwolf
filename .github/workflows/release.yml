name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # OIDC for PyPI trusted publishing
  attestations: write # sigstore attestations

jobs:
  release:
    name: Build, attest, and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, '.'); import depwolf; print(depwolf.__version__)")
          echo "package version: $VERSION"
          echo "tag:            ${{ github.ref_name }}"
          test "${{ github.ref_name }}" = "v$VERSION"

      - name: Install build backend
        run: python -m pip install --upgrade pip && python -m pip install build

      - name: Build artifacts
        run: python -m build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
