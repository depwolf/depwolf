name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev deps
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check depwolf tests

      - name: Format check (ruff format)
        run: ruff format --check depwolf tests

      - name: Types (mypy)
        run: mypy depwolf

      - name: Tests with coverage
        run: python -m pytest tests/ -q --cov=depwolf --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install --upgrade pip && python -m pip install build

      - name: Build artifacts
        run: python -m build

      - name: Smoke test wheel in fresh venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/depwolf --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
