name: SCA self-scan

# depwolf dogfooding: run the FP-reduction funnel over its own repo and upload
# the SARIF to GitHub Code Scanning. The 1.5 GB cpe_index.db is cached and
# refreshed weekly (or on demand via workflow_dispatch).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      threshold:
        description: "Fail gate: fail on risk score >= threshold"
        default: "60"
        required: false
        type: number

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install depwolf
        run: python -m pip install --quiet .

      - name: Restore cpe_index.db cache
        id: cache-db
        uses: actions/cache@v4
        with:
          path: cpe_index.db
          key: cpe-index-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cpe-index-${{ runner.os }}-

      - name: Obtain cpe_index.db
        id: db
        env:
          AVIP_DB_URL: ${{ secrets.AVIP_DB_URL }}
        run: |
          if [ -s cpe_index.db ]; then
            echo "Using cached cpe_index.db ($(stat -c %s cpe_index.db) bytes)"
          elif [ -n "$AVIP_DB_URL" ]; then
            curl -fsSL "$AVIP_DB_URL" -o cpe_index.db
            echo "Downloaded cpe_index.db ($(stat -c %s cpe_index.db) bytes)"
          else
            echo "No cache or AVIP_DB_URL; running incremental sync (needs internet)"
            depwolf sync
          fi

      - name: Run depwolf self-scan (SARIF + gate)
        id: scan
        continue-on-error: true
        env:
          AVIP_DB_PATH: ${{ github.workspace }}/cpe_index.db
        run: |
          THRESHOLD="${{ github.event.inputs.threshold || 60 }}"
          depwolf scan . --format sarif --threshold "$THRESHOLD" > depwolf.sarif

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: depwolf.sarif

      - name: Save cpe_index.db cache
        if: steps.db.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: cpe_index.db
          key: cpe-index-${{ runner.os }}-${{ github.run_id }}

      - name: Fail gate on findings
        if: steps.scan.outcome != 'success'
        run: exit 1
