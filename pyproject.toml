[project]
name = "depwolf"
description = "Post-process any scanner output (Trivy, Grype, SAST, ...): CVE extraction, AVIP false-positive reduction, AI remediation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "depwolf maintainers" }]
keywords = ["security", "sca", "scanner", "cve", "supply-chain", "avip", "trivy", "grype"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5"]
dev = ["pytest>=8.3", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10", "cryptography>=42.0"]
sync = ["cryptography>=42.0"]

[project.urls]
Homepage = "https://github.com/depwolf/depwolf"
Source = "https://github.com/depwolf/depwolf"
Issues = "https://github.com/depwolf/depwolf/issues"
Changelog = "https://github.com/depwolf/depwolf/blob/main/CHANGELOG.md"

[project.scripts]
depwolf = "depwolf.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "depwolf.__version__" }

[tool.setuptools]
packages = [
    "depwolf",
    "depwolf.application",
    "depwolf.domain",
    "depwolf.infrastructure",
    "depwolf.interfaces",
]

[tool.setuptools.package-data]
depwolf = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["depwolf"]
omit = ["depwolf/*/__init__.py"]

[tool.coverage.report]
show_missing = true
# Floor only; the push to 80% lands after the FP pipeline stabilizes (post
# batch-matching / typed adapters). Raised then in the hardening pass.
fail_under = 45
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["depwolf"]
